# apps VPS (31.97.196.127): يستبدل /etc/nginx/sites-enabled/files.details-wms.cloud.tunnel بالكامل.
# الصفحات العامة غير المصادق عليها (/r, /s, /public, /api/public) وواجهة API الخاصة بالموظفين (/api/app)
# و/internal تبقى على الخلفية القديمة (127.0.0.1:3500) دون أي تغيير — بما في ذلك سلوك عدم تمرير هوية
# الموظف على المسارات العامة (يتحكم به الجسر نفسه، غير متأثر بهذا الملف). كل شيء آخر (شاشة الموظفين نفسها:
# / و /app و /app/* وأصول الواجهة الجديدة) يذهب للواجهة الأمامية الجديدة المبنية من لوفابل (127.0.0.1:3501).
# رجوع فوري: cp *.tunnel.bak على الملف الحالي ثم nginx -t && systemctl reload nginx.
server {
    listen 10.9.0.3:80;
    server_name files.details-wms.cloud;
    client_max_body_size 2g;
    proxy_request_buffering off;

    # عام + API الموظفين + الداخلي: الخلفية القديمة دون أي تغيير
    location ~ ^/(r|s|public|api|internal)(/|$) {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Gw-Proxy "1";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
    location = /favicon.ico { proxy_pass http://127.0.0.1:3500; proxy_set_header Host $host; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:3500; proxy_set_header Host $host; }

    # شاشة الموظفين: الواجهة الجديدة (لوفابل) — الصفحة + الأصول الثابتة
    location / {
        proxy_pass http://127.0.0.1:3501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Gw-Proxy "1";
        # X-Gw-Employee-No / X-Gw-Name / X-Gw-Email / X-Gw-Role / X-Gw-Level تمر كما هي من الجسر
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
